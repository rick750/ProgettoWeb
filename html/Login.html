<!DOCTYPE html>
<html lang="it">
    <head>
    <title>Unigames-Login</title>
    <link rel="stylesheet" href="../css/style.css">
    </head>
    <main>
        <form action="#">
            <h1>Inserisci i dati del nuovo utente</h1>
            <fieldset>
                <label for="nome">Nome</label><br/>
                <input type="text" id="nome" name="nome"/><br/><br/>
                <label for="cognome">Cognome</label><br/>
                <input type="text" id="cognome" name="cognome"><br/><br/>
                <label for="data_nascita">Data di nascita</label><br/>
                <input type="date" id="data_nascita" name ="data nascita"><br/><br/>
                <label for="matricola">Matricola</label><br/>
                <input type="text" id="matricola" name="matricola"><br/><br/>
                <label for="mail">Mail istituzionale</label><br/>
                <input type="text" id="mail" name="mail"><br/><br/>
                <label for="descr">Dicci qualcosa di te!</label><br/>
                <textarea id="descr" name="descr" rows="5" cols="80" maxlength="200"></textarea><br/><br/>
            </fieldset>
        </form>
    </main>
</html>
