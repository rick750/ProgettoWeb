<!DOCTYPE html>
<html lang="it">
    <head>
        <title>Unigames-aggiunta post</title>
        <link rel="stylesheet" href="../css/style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <main class="bg-light text-dark">
            <form action="#"  method="POST">
                <h1 class="fw-bold text-uppercase text-primary mb-0">Inserisci i dati del nuovo Post</h1>
                <fieldset class=" flex-wrap align-items-center gap-3">
                    <label for="titolo" class="form-text-label">Titolo</label><br/>
                    <input type="text" id="titolo" name="titolo" class="form-text-input"/><br/><br/>
                    <label class="form-label">Tipo di post</label><br/>
                    <label for="generico" class="form-radio-label">Generico</label>
                    <input type="radio" id="generico" name="tipo_post" class="form-radio-input">
                    <label for="recensione_videogioco" class="form-radio-label">Recensione Videogioco in libreria</label>
                    <input type="radio" id="recensione_videogioco" name="tipo_post" class="form-radio-input"><br/><br/>

                    <div id="sezione_recensione_videogioco" class="container-fluid text-center">
                        <label for="scelta_gioco" class="form-label">Scegli il gioco da recensire:</label>
                        <select id="scelta_gioco" name="scelta_gioco" class="form-select">
                        <option value = "">-- Seleziona un videogioco --</option>
                        <option value="Elden Ring">Elden Ring</option>
                        <option value="Clair Obscure: Expedition 33">Clair Obscure: Expedition 33</option>
                        <option value="God of War">God of War</option>
                        <option value="Dark Souls III">Dark Souls III</option>
                        </select><br/><br/>

                        <label for="voto" class="form-label">Valuta il gioco secondo la tua opinione:</label>
                        <select id="voto" name="voto" class="form-select">
                        <option value="">-- Seleziona un voto --</option>
                        <option value="0">0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                        <option value="2.5">2.5</option>
                        <option value="3">3</option>
                        <option value="3.5">3.5</option>
                        <option value="4">4</option>
                        <option value="4.5">4.5</option>
                        <option value="5">5</option>
                        </select><br/><br/>
                        <label for="testo_rec" class="form-textarea-label">Testo della recensione</label><br/>
                        <textarea id="testo_rec" name="testo_rec" rows="20" cols="120" maxlength="1000" class="form-control"></textarea><br/><br/>
                    </div>

                    <div id = "sezione_generico" class="container-fluid text-center">
                        <label for="testo_post" class="form-label">Testo del post</label><br/>
                        <textarea id="testo_post" name="testo_post" rows="20" cols="120" maxlength="1000" class="form-control"></textarea><br/><br/>
                    </div>
                    
                    
                </fieldset>
                <input type="submit" value="invia" class="btn btn-primary rounded-pill px-4">
                <input type="reset" value="cancella" class="btn btn-primary rounded-pill px-4">
            </form>
    
        <script> 
            const radioGenerico = document.getElementById("generico");
            const radioRecensione = document.getElementById("recensione_videogioco");
            const sezioneGenerico = document.getElementById("sezione_generico");
            const sezioneRecensione = document.getElementById("sezione_recensione_videogioco");

            sezioneGenerico.style.display = "none";
            sezioneRecensione.style.display = "none";

            radioGenerico.addEventListener("change", () => {
                sezioneGenerico.style.display = "block";
                sezioneRecensione.style.display = "none"; 
            });
            radioRecensione.addEventListener("change", () => { 
                sezioneGenerico.style.display = "none";
                sezioneRecensione.style.display = "block"; 
            });
        </script>
    </main>
</html>
