<!DOCTYPE html>
<html lang="it">
    <head>
    <title>Unigames-aggiunta videogioco in libreria</title>
    <link rel="stylesheet" href="../css/style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <main class="bg-light text-dark">
            <form action="#"  method="POST" enctype="multipart/form-data">
                <h1 class="fw-bold text-uppercase text-primary mb-0">Inserisci i dati del Videogioco</h1>
                <fieldset class=" flex-wrap align-items-center gap-3">
                    <label for="immagine" class="form-file-label">Aggiungi immagine:</label><br/>
                    <input type="file" id="immagine" name="immagine" accept="image/*" class="form-file-input"><br/><br/>
                    <label for="titolo" class="form-text-label">Titolo</label><br/>
                    <input type="text" id="titolo" name="titolo" class="form-text-input"/><br/><br/>
                    <label for="anno_pubb" class="form-date-label">Anno di pubblicazione</label><br/>
                    <input type="date" id="anno_pubb" name="anno_pubb" class="form-date-input"><br/><br/>
                    <label for="software_house" class="form-text-label">Software house</label><br/>
                    <input type="text" id="software_house" name ="software_house" class="form-text-input"><br/><br/>

                    <label for="scelte" class="form-label">tag che descrivono il gioco:</label>
                    <div class="mb-10">
                        <label class="form-label">Scegli una o più opzioni</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="avventura" name="scelte[]" value="1">
                            <label class="form-check-label" for="avventura">Avventura</label> 
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="azione" name="scelte[]" value="2">
                            <label class="form-check-label" for="azione">Azione</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="famiglia" name="scelte[]" value="3">
                            <label class="form-check-label" for="famiglia">Famiglia</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="gioco_di_ruolo" name="scelte[]" value="4">
                            <label class="form-check-label" for="gioco_di_ruolo">Gioco di ruolo</label>
                        </div>                        
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="horror" name="scelte[]" value="5">
                            <label class="form-check-label" for="horror">Horror</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="indie" name="scelte[]" value="6">
                            <label class="form-check-label" for="indie">Indie</label>
                        </div> 
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="platform" name="scelte[]" value="7">
                            <label class="form-check-label" for="platform">Platform</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="sparatutto" name="scelte[]" value="8">
                            <label class="form-check-label" for="sparatutto">Sparatutto</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="sport" name="scelte[]" value="9">
                            <label class="form-check-label" for="sport">Sport</label>
                        </div>                         
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="visual_novel" name="scelte[]" value="10">
                            <label class="form-check-label" for="visual_novel">Visual Novel</label>
                        </div>
                    </div>
                    <label for="voto" class="form-label">Recensione testata giornalistica:</label>
                    <select id="voto" name="voto" class="form-select">
                        <option value="">-- Seleziona un voto --</option>
                        <option value="0">0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                        <option value="2.5">2.5</option>
                        <option value="3">3</option>
                        <option value="3.5">3.5</option>
                        <option value="4">4</option>
                        <option value="4.5">4.5</option>
                        <option value="5">5</option>
                    </select><br/><br/>
                <label for="descr" class="form-label">Descrizione testuale</label><br/>
                <textarea id="descr" name="descr" rows="20" cols="120" maxlength="1000" class="form-control"></textarea><br/><br/>
                </fieldset>
                <input type="submit" value="invia" class="btn btn-primary rounded-pill px-4">
                <input type="reset" value="cancella" class="btn btn-primary rounded-pill px-4">
            </form>
        
    </main>
</html>
